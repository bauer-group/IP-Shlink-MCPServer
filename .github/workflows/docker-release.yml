name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.coolify.yml", "docker-compose.traefik.yml", "docker-compose.development.yml"]'
      env-file: '.env.example'
      validate-services: '["shlink-mcp", "redis"]'

  validate-scripts:
    name: 🔍 Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'error'

  # The Python gate: ruff + mypy --strict + pytest with coverage enforced.
  # Listed in the release job's `needs` below, so no tag, GitHub Release or
  # CHANGELOG entry can be cut while the suite is red. Before this, the Python
  # suite ran only inside the Docker test stage — in the job that runs AFTER
  # the release — so a red main was versioned first and failed second.
  quality:
    name: 🧪 Tests
    uses: ./.github/workflows/tests.yml

  # ============================================
  # Image Build Gate (every event, never pushed)
  # ============================================

  # Builds the image from this commit on every event - the PR CI that
  # docker-maintenance.yml waits for, and on a push or dispatch the gate
  # of the release: a failed build skips the release and the image push.
  docker-build-bg-shlink-mcp-validate:
    name: 🔨 Validate bg-shlink-mcp Build
    needs: [validate-compose, validate-scripts, quality]
    if: |
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.quality.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/IP-Shlink-MCPServer/bg-shlink-mcp'

      auto-tags: true
      dockerfile-path: './app/bg-shlink-mcp/Dockerfile'
      docker-context: './app/bg-shlink-mcp'
      platforms: 'linux/amd64,linux/arm64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Release Job (push to main or dispatch)
  # ============================================

  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, validate-scripts, quality, docker-build-bg-shlink-mcp-validate]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.docker-build-bg-shlink-mcp-validate.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      # Release the commit this run tested and built - the image job below
      # builds it too. Unpinned, the release would take the tip of main: a
      # push that landed meanwhile would be tagged untested and be missing
      # from the image. Pinned, nothing is released once main has moved on,
      # and the run for the newer main releases both.
      ref: ${{ github.sha }}
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
      extra-plugins: '@semantic-release/exec'
    secrets: inherit

  # ============================================
  # Docker Publish (bg-shlink-mcp image, only after a release)
  # ============================================

  docker-build-bg-shlink-mcp-release:
    name: 🐳 Build & Push bg-shlink-mcp
    needs: release
    # Only a run that created a release publishes - never a PR, a branch
    # dispatch or a run that released nothing.
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/IP-Shlink-MCPServer/bg-shlink-mcp'
      docker-image-name: 'bauergroup/bg-shlink-mcp'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './app/bg-shlink-mcp/Dockerfile'
      docker-context: './app/bg-shlink-mcp'
      platforms: 'linux/amd64,linux/arm64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit
