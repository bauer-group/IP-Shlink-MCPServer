# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# Every Dependabot PR reaches this workflow (no `paths:` filter), so each one
# gets an explicit decision (annotation + job summary) instead of silently
# staying open because the trigger never fired. Per ecosystem:
#
# * docker (app/bg-shlink-mcp/Dockerfile) and pip (app/bg-shlink-mcp/
#   pyproject.toml): tested - a patch update is merged once the PR run of
#   docker-release.yml passed. That run (paths app/**) runs tests.yml and
#   builds the image, which installs pyproject.toml and runs pytest.
# * docker-compose (docker-compose*.yml): not tested - that PR run only checks
#   `docker compose config`. Redis is on a floating major tag, so any bump is
#   a major update and stays open for review (merge-update-types: patch).
# * github-actions and any change under .github/: never merged automatically.
#
# The merge uses GITHUB_TOKEN, which starts no `push` workflow: the release
# and image build follow with the next push to main or a manual dispatch.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # runs the tests and builds the image.
      required-workflows: '.github/workflows/docker-release.yml'
    secrets: inherit
